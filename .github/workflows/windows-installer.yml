name: Windows v1.7.0 Omnichannel Sales Installer

on:
  push:
    branches: ["release/stage-170-windows", "white-label/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web UI
        shell: pwsh
        run: |
          Set-Location apps/web
          npm install
          npm run build
          Set-Location ../..
          if (!(Test-Path "apps/web/dist/index.html")) { throw "Frontend build output is missing" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r desktop/requirements-desktop.txt

      - name: Run API tests
        shell: pwsh
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./v170-test.db
        run: |
          Set-Location services/api
          pytest -q
          Set-Location ../..

      - name: Run UI Release Gate
        shell: pwsh
        run: |
          Set-Location apps/web
          npx playwright install chromium
          Set-Location ../..

          Remove-Item "services/api/e2e-v170.db" -ErrorAction SilentlyContinue
          $env:APP_ENV = "desktop"
          $env:DATABASE_URL = "sqlite:///./e2e-v170.db"
          $env:NEXVARY_STATIC_DIR = (Resolve-Path "apps/web/dist").Path
          $env:JWT_SECRET = "v170-release-gate-jwt-secret-at-least-32-bytes-long"
          $env:PLATFORM_ADMIN_KEY = "v170-release-gate-platform-key-at-least-32-bytes"
          $env:INTEGRATION_MASTER_SECRET = "v170-release-gate-integration-secret-at-least-32-bytes"
          $server = Start-Process python -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000","--log-level","warning" -WorkingDirectory "services/api" -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 1
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "E2E server did not become ready" }

            Set-Location apps/web
            $env:E2E_BASE_URL = "http://127.0.0.1:8000"
            npm run test:e2e
            if ($LASTEXITCODE -ne 0) { throw "UI Release Gate failed" }
            Set-Location ../..
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Generate application icon
        shell: pwsh
        run: python desktop/build_icon.py

      - name: Build frozen desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean desktop/NEXVARY-RealEstate-AI-OS.spec
          if (!(Test-Path "dist/NEXVARY-RealEstate-AI-OS/NEXVARY-RealEstate-AI-OS.exe")) { throw "Frozen executable is missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "desktop\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "installer/NEXVARY-RealEstate-AI-OS-WhiteLabel-v1.7.0-Setup.exe")) { throw "Installer output is missing" }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash "installer/NEXVARY-RealEstate-AI-OS-WhiteLabel-v1.7.0-Setup.exe" -Algorithm SHA256
          "$($hash.Hash)  NEXVARY-RealEstate-AI-OS-WhiteLabel-v1.7.0-Setup.exe" | Out-File -FilePath "installer/SHA256.txt" -Encoding ascii
          Get-Item "installer/NEXVARY-RealEstate-AI-OS-WhiteLabel-v1.7.0-Setup.exe" | Select-Object Name, Length, LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-RealEstate-AI-OS-WhiteLabel-v1.7.0-Windows
          path: |
            installer/NEXVARY-RealEstate-AI-OS-WhiteLabel-v1.7.0-Setup.exe
            installer/SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
