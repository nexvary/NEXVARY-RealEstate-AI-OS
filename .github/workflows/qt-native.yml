name: Qt Native Migration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["migration/**"]
    paths:
      - "apps/desktop-qt/**"
      - ".github/workflows/qt-native.yml"
  pull_request:
    paths:
      - "apps/desktop-qt/**"
      - ".github/workflows/qt-native.yml"
      - "services/api/**"

permissions:
  contents: read

jobs:
  native-build:
    name: Qt 6 C++20 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Configure
        shell: bash
        run: cmake -S apps/desktop-qt -B build-qt -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build-qt --config Release --parallel 2

      - name: Test
        shell: bash
        run: ctest --test-dir build-qt -C Release --output-on-failure

      - name: Setup Python for native sidecar
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native sidecar packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install -r desktop/requirements-desktop.txt

      - name: Build NEXVARY icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: python desktop/build_icon.py

      - name: Build local API sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: pyinstaller desktop/NEXVARY-RealEstate-API.spec --noconfirm --clean

      - name: Stage Qt native runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build-qt --config Release --prefix native-dist
          $exe = Resolve-Path "native-dist/bin/nexvary_realestate_native.exe"
          windeployqt --release --qmldir apps/desktop-qt/qml $exe
          Copy-Item "dist/NEXVARY-RealEstate-API.exe" "native-dist/bin/NEXVARY-RealEstate-API.exe" -Force

      - name: Smoke-test packaged Qt client with bundled API sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native-dist/smoke | Out-Null
          $env:NEXVARY_SIDECAR_LOG = (Resolve-Path "native-dist/smoke").Path + "\sidecar-boot.log"
          $api = Start-Process -FilePath "native-dist/bin/NEXVARY-RealEstate-API.exe" -ArgumentList "--port","8765" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              if (Test-Path $env:NEXVARY_SIDECAR_LOG) {
                Write-Host "===== Packaged sidecar boot log ====="
                Get-Content $env:NEXVARY_SIDECAR_LOG
              }
              if ($api.HasExited) { Write-Host "Sidecar exit code: $($api.ExitCode)" }
              throw "Packaged API sidecar did not become healthy"
            }

            $env:QT_QPA_PLATFORM = "minimal"
            $env:QT_QUICK_BACKEND = "software"
            $env:NEXVARY_QT_LOG = (Resolve-Path "native-dist/smoke").Path + "\qt-startup.log"
            & "native-dist/bin/nexvary_realestate_native.exe" --api-url "http://127.0.0.1:8765" --language ar --width 1600 --height 900 --smoke-test
            if ($LASTEXITCODE -ne 0) {
              if (Test-Path $env:NEXVARY_QT_LOG) {
                Write-Host "===== Packaged Qt startup log ====="
                Get-Content $env:NEXVARY_QT_LOG
              }
              throw "Packaged Qt runtime smoke test failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            if ($api -and -not $api.HasExited) { Stop-Process -Id $api.Id -Force }
          }

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile native preview installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native-installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "desktop\native-installer.iss"

      - name: Generate native installer SHA256
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = Get-ChildItem "native-installer\NEXVARY-RealEstate-AI-OS-Native-v2.0.0-Preview-Setup.exe"
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii "native-installer\SHA256.txt"
          Get-Content "native-installer\SHA256.txt"

      - name: Upload Windows native preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-RealEstate-AI-OS-Native-v2.0.0-Preview-Windows
          path: |
            native-installer/NEXVARY-RealEstate-AI-OS-Native-v2.0.0-Preview-Setup.exe
            native-installer/SHA256.txt
            native-dist/smoke/sidecar-boot.log
          if-no-files-found: error

      - name: QML Arabic RTL screenshot gate
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p build-qt/ui-gate
          ./build-qt/nexvary_realestate_native \
            --language ar \
            --width 1600 \
            --height 900 \
            --screenshot build-qt/ui-gate/native-ar-1600x900.png 2>&1 | tee build-qt/ui-gate/native-ar.log
          test -s build-qt/ui-gate/native-ar-1600x900.png
          ! grep -E "QML .*Cannot open|QQmlApplicationEngine failed|module .* is not installed" build-qt/ui-gate/native-ar.log

      - name: QML English screenshot gate
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          ./build-qt/nexvary_realestate_native \
            --language en \
            --width 1600 \
            --height 900 \
            --screenshot build-qt/ui-gate/native-en-1600x900.png 2>&1 | tee build-qt/ui-gate/native-en.log
          test -s build-qt/ui-gate/native-en-1600x900.png
          ! grep -E "QML .*Cannot open|QQmlApplicationEngine failed|module .* is not installed" build-qt/ui-gate/native-en.log

      - name: Upload native UI gate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: qt-native-ui-gate
          path: |
            build-qt/ui-gate/*.png
            build-qt/ui-gate/*.log
          if-no-files-found: error
